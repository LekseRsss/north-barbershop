<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Администратор — North Barbershop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px 16px;
      background: #101010;
      color: #f7f4ee;
      font-family: Arial, sans-serif;
    }
    main { max-width: 1000px; margin: auto; }
    h1 { color: #c6a46a; }
    .subtitle { color: #bfb8aa; }
    .panel {
      margin-top: 24px;
      padding: 22px;
      background: #191919;
      border: 1px solid #40382b;
      border-radius: 10px;
    }
    .notice {
      padding: 14px;
      background: #29251e;
      border-radius: 6px;
      line-height: 1.5;
    }
    a { color: #c6a46a; }
  </style>
</head>
<body>
  <main>
    <h1>NORTH — Администратор</h1>
    <p class="subtitle">Панель управления записями клиентов</p>

    <section class="panel">
      <h2>Записи клиентов</h2>
      <div class="notice">
        Страница создана. Подключение записей и безопасный вход
        администратора будут настроены следующим шагом.
      </div>
    </section>

    <p><a href="./">← Вернуться на сайт</a></p>
  </main>
</body>
