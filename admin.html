
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>NORTH — Администратор</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #c6a46a;
      --gold-light: #e0c18a;
      --bg: #101010;
      --panel: #191919;
      --line: #40382b;
      --muted: #bfb8aa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 16px;
      background: var(--bg);
      color: #f7f4ee;
      font-family: Arial, sans-serif;
      line-height: 1.55;
    }

    main { max-width: 1000px; margin: auto; }

    h1, h2 { color: var(--gold); }
    h1 { font-size: clamp(27px, 5vw, 38px); }
    .muted { color: var(--muted); }

    .panel {
      margin-top: 20px;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    label { display: block; margin-top: 12px; }

    input, button {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 5px;
      font: inherit;
    }

    input {
      color: white;
      background: var(--bg);
      border: 1px solid #504735;
    }

    button {
      color: #101010;
      background: var(--gold);
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: var(--gold-light); }
    button:disabled { opacity: .55; cursor: wait; }
    button.secondary { background: #333; color: white; }
    button.confirm { background: #426b4b; color: white; }
    button.cancel { background: #7a3030; color: white; }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions button { flex: 1; min-width: 135px; }
    .booking { padding: 18px 0; border-bottom: 1px solid var(--line); }
    .booking:last-child { border-bottom: 0; }
    .status { color: var(--gold-light); font-weight: bold; }
    .message { overflow-wrap: anywhere; }
    a { color: var(--gold-light); }
    [hidden] { display: none !important; }

    @media (max-width: 520px) {
      body { padding: 18px 12px; }
      .panel { padding: 15px; }
      .actions { flex-direction: column; gap: 2px; }
      .actions button { width: 100%; }
    }
  </style>
</head>
<body>
<main>
  <h1>NORTH — Администратор</h1>
  <p class="muted">Управление записями клиентов</p>

  <section class="panel" id="login-panel">
    <h2>Вход администратора</h2>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username"
        required placeholder="Email администратора">

      <label for="password">Пароль</label>
      <input id="password" type="password"
        autocomplete="current-password" required>

      <button id="login-button" type="submit">Войти</button>
    </form>
    <p id="login-message" class="message" role="status"></p>
  </section>

  <section class="panel" id="bookings-panel" hidden>
    <div class="actions">
      <button id="refresh-button" type="button">Обновить заявки</button>
      <button id="logout-button" class="secondary" type="button">Выйти</button>
    </div>
    <p id="bookings-message" class="message" role="status" aria-live="polite"></p>
    <div id="bookings-list"></div>
  </section>

  <p><a href="./">← Вернуться на сайт</a></p>
</main>

<script type="module">
  import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL =
    "https://dctbpxvfpqdidzbewryr.supabase.co";
  const SUPABASE_KEY =
    "sb_publishable_nL_Ndkc8LbZ6dG-n5j9DGg_lWwwPE3C";

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (selector) => document.querySelector(selector);
  const loginPanel = $("#login-panel");
  const bookingsPanel = $("#bookings-panel");
  const loginForm = $("#login-form");
  const loginMessage = $("#login-message");
  const bookingsMessage = $("#bookings-message");
  const bookingsList = $("#bookings-list");
  const refreshButton = $("#refresh-button");
  const logoutButton = $("#logout-button");

  let busy = false;

  const statusLabels = {
    pending: "Ожидает подтверждения",
    confirmed: "Подтверждена",
    cancelled: "Отменена"
  };

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (busy) return;

    busy = true;
    $("#login-button").disabled = true;
    loginMessage.textContent = "Выполняется вход…";

    try {
      const { error } = await supabase.auth.signInWithPassword({
        email: $("#email").value.trim(),
        password: $("#password").value
      });

      if (error) {
        loginMessage.textContent =
          "Войти не удалось. Проверь email и пароль.";
        return;
      }

      loginMessage.textContent = "";
      await loadBookings();
    } catch {
      loginMessage.textContent =
        "Ошибка соединения. Попробуй ещё раз.";
    } finally {
      busy = false;
      $("#login-button").disabled = false;
    }
  });

  refreshButton.addEventListener("click", loadBookings);

  logoutButton.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    logoutButton.disabled = true;

    try {
      const { error } = await supabase.auth.signOut();
      if (error) {
        bookingsMessage.textContent = "Не удалось выйти. Попробуй ещё раз.";
        return;
      }

      bookingsPanel.hidden = true;
      loginPanel.hidden = false;
      bookingsList.replaceChildren();
      loginForm.reset();
      loginMessage.textContent = "Ты вышла из панели.";
    } finally {
      busy = false;
      logoutButton.disabled = false;
    }
  });

  async function loadBookings() {
    if (busy) return;
    busy = true;
    refreshButton.disabled = true;
    bookingsMessage.textContent = "Загружаем заявки…";
    bookingsList.replaceChildren();

    try {
      const { data: { session }, error: sessionError } =
        await supabase.auth.getSession();

      if (sessionError || !session) {
        bookingsPanel.hidden = true;
        loginPanel.hidden = false;
        bookingsMessage.textContent = "";
        return;
      }

      const { data, error } = await supabase
        .from("bookings")
        .select(
          "id, customer_name, phone, service, booking_date, booking_time, status"
        )
        .order("booking_date", { ascending: true })
        .order("booking_time", { ascending: true });

      if (error) {
        bookingsMessage.textContent =
          "Не удалось загрузить заявки. Проверь RLS и права доступа администратора.";
        return;
      }

      loginPanel.hidden = true;
      bookingsPanel.hidden = false;

      if (!data.length) {
        bookingsMessage.textContent = "Пока заявок нет.";
        return;
      }

      bookingsMessage.textContent = `Заявок найдено: ${data.length}`;

      for (const booking of data) {
        const card = document.createElement("article");
        card.className = "booking";

        const heading = document.createElement("h3");
        heading.textContent =
          `${booking.customer_name || "Без имени"} — ${booking.service || "Услуга не указана"}`;

        const details = document.createElement("p");
        details.textContent =
          `Телефон: ${booking.phone || "—"} · Дата: ${booking.booking_date || "—"} · Время: ${booking.booking_time || "—"}`;

        const status = document.createElement("p");
        status.className = "status";
        status.textContent =
          `Статус: ${statusLabels[booking.status] || booking.status || "Не указан"}`;

        card.append(heading, details, status);

        if (!["confirmed", "cancelled"].includes(booking.status)) {
          const actions = document.createElement("div");
          actions.className = "actions";

          const confirmButton = document.createElement("button");
          confirmButton.type = "button";
          confirmButton.className = "confirm";
          confirmButton.textContent = "Подтвердить";
          confirmButton.addEventListener("click", () =>
            updateStatus(booking.id, "confirmed")
          );

          const cancelButton = document.createElement("button");
          cancelButton.type = "button";
          cancelButton.className = "cancel";
          cancelButton.textContent = "Отменить";
          cancelButton.addEventListener("click", () =>
            updateStatus(booking.id, "cancelled")
          );

          actions.append(confirmButton, cancelButton);
          card.append(actions);
        }

        bookingsList.append(card);
      }
    } catch {
      bookingsMessage.textContent =
        "Ошибка соединения при загрузке заявок.";
    } finally {
      busy = false;
      refreshButton.disabled = false;
    }
  }

  async function updateStatus(id, newStatus) {
    if (busy) return;

    const action = newStatus === "confirmed" ? "подтвердить" : "отменить";
    if (!window.confirm(`Ты действительно хочешь ${action} эту запись?`)) {
      return;
    }

    busy = true;
    bookingsMessage.textContent = "Сохраняем изменение…";
    refreshButton.disabled = true;

    try {
      const { data, error } = await supabase
        .from("bookings")
        .update({ status: newStatus })
        .eq("id", id)
        .select("id");

      if (error) {
        bookingsMessage.textContent =
          "Статус не изменён. Проверь политику Admin can update bookings и её условия.";
        return;
      }

      if (!data || data.length === 0) {
        bookingsMessage.textContent =
          "Статус не изменён: нет прав на эту запись или заявка не найдена.";
        return;
      }

      bookingsMessage.textContent = "Статус обновлён.";
    } catch {
      bookingsMessage.textContent =
        "Ошибка соединения при изменении статуса.";
      return;
    } finally {
      busy = false;
      refreshButton.disabled = false;
    }

    await loadBookings();
    bookingsMessage.textContent = "Статус успешно обновлён.";
  }

  const { data: { session } } = await supabase.auth.getSession();
  if (session) await loadBookings();
</script>
</body>
</html>
